services:
  - type: web
    name: mahanaim-academy
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: SMS_PROVIDER_URL
        sync: false
      - key: SMS_PROVIDER_TOKEN
        sync: false
      - key: EMAIL_API_URL
        sync: false
      - key: EMAIL_API_TOKEN
        sync: false
      - key: SCHOOL_FROM_EMAIL
        sync: false
    disk:
      name: mahanaim-academy-data
      mountPath: /var/data
      sizeGB: 1
