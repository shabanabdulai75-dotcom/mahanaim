services:
  - type: web
    name: mahanaim-academy
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: DEMO_ADMIN_PASSWORD
        sync: false
    disk:
      name: mahanaim-academy-data
      mountPath: /var/data
      sizeGB: 1
